[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wakeproxy"
version = "1.3.0"
description = "Wakes a machine when something needs it and shuts it down when nothing does"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wakeproxy = "wakeproxy.__main__:main"

[tool.setuptools.packages.find]
include = ["wakeproxy*"]

[tool.setuptools.package-data]
wakeproxy = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
