  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <mask id="crescent"><rect width="64" height="64" fill="#fff"/><circle cx="51.5" cy="12" r="6.5" fill="#000"/></mask>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <circle cx="47" cy="16" r="7" fill="#fbbf24" mask="url(#crescent)"/>
  <path d="M20 26.5 A15 15 0 1 0 40 26.5" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="30" y1="17" x2="30" y2="35" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
</svg>
